<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonetos — Poesía Clásica</title>
  <!-- Exactamente 2 tipos de letra: Lora (Poesía) e Inter (UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/spatial.css">
  <link rel="stylesheet" href="css/chromatic.css">
  <link rel="stylesheet" href="css/typographic.css">
  <script type="module" src="js/controller.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>Sonetos</h1>
    <p>Poesía clásica española</p>
  </header>

  <main class="app-main">
    <!-- Vista Galería -->
    <section id="gallery" class="view">
      <ul class="gallery-list"></ul>
    </section>

    <!-- Vista Lector -->
    <section id="reader" class="view hidden">
      <nav class="toolbar">
        <button id="btn-back">← Volver</button>
        <div class="font-sizer">
          <button id="btn-dec" title="Disminuir letra">A-</button>
          <button id="btn-inc" title="Aumentar letra">A+</button>
        </div>
      </nav>
      <article class="sonnet-card"></article>
    </section>
  </main>
</body>
</html>
